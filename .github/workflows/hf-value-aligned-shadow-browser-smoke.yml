name: HF value-aligned shadow browser smoke

on:
  workflow_dispatch:
    inputs:
      operator_url:
        description: URL of a running operator dashboard backed by the local API stack
        required: true
        default: http://localhost:64163/operator
      smoke_today:
        description: Anchor date used for today/tomorrow/day+2 readiness probes
        required: true
        default: "2026-06-02"

jobs:
  browser-smoke:
    name: HF value-aligned shadow browser smoke
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard

      - name: Install Chromium for Playwright
        run: npx --prefix dashboard playwright install chromium

      - name: Run HF value-aligned shadow browser smoke
        run: npm -C dashboard run smoke:hf-value-aligned
        env:
          SMART_ARBITRAGE_OPERATOR_URL: ${{ inputs.operator_url }}
          SMART_ARBITRAGE_BROWSER_SMOKE_TODAY: ${{ inputs.smoke_today }}
