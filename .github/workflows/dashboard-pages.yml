name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - dashboard/**
      - docs/project-intro/**
      - docs/technical/final-demo-assets/project-intro.mp4
      - docs/technical/final-demo-assets/project-intro-poster.png
      - .github/workflows/dashboard-pages.yml
  workflow_run:
    workflows:
      - Publish public BESS index
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-dashboard
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Generate static dashboard
        working-directory: dashboard
        env:
          NUXT_APP_BASE_URL: /Diploma/
          NUXT_PUBLIC_SITE_URL: https://ilyafefelov.github.io/Diploma
        run: npm run generate

      - name: Add project intro video page
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dashboard/.output/public/project-intro
          mkdir -p dashboard/.output/public/technical/final-demo-assets
          cp docs/project-intro/index.html dashboard/.output/public/project-intro/index.html
          cp docs/technical/final-demo-assets/project-intro.mp4 dashboard/.output/public/technical/final-demo-assets/project-intro.mp4
          cp docs/technical/final-demo-assets/project-intro-poster.png dashboard/.output/public/technical/final-demo-assets/project-intro-poster.png

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/.output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
