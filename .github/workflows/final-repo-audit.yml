name: Final repository audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  final-repo-audit:
    name: Final repository audit
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard

      - name: Run final repository audit
        shell: pwsh
        run: .\scripts\final_repo_audit.ps1 -SkipFullVerify -SkipSmoke
