name: Publish public BESS index

on:
  schedule:
    - cron: "35 5 * * *"
    - cron: "35 8 * * *"
  workflow_dispatch:
    inputs:
      delivery_date:
        description: "Optional realized index delivery date, YYYY-MM-DD"
        required: false
        type: string
      target_delivery_date:
        description: "Optional forecast challenge target date, YYYY-MM-DD"
        required: false
        type: string
      fail_on_fetch_error:
        description: "Fail when OREE cannot provide fresh source rows; false only for an intentional diagnostic run"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: public-bess-index-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-public-json:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
      OUTPUT_DIR: dashboard/public/data/bess-arbitrage-index
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Resolve Kyiv publication dates
        id: dates
        shell: bash
        run: |
          set -euo pipefail
          echo "delivery_date=$(TZ=Europe/Kyiv date -d 'yesterday' +%F)" >> "$GITHUB_OUTPUT"
          echo "target_delivery_date=$(TZ=Europe/Kyiv date -d 'tomorrow' +%F)" >> "$GITHUB_OUTPUT"

      - name: Resolve publisher inputs
        id: publish_inputs
        shell: bash
        env:
          DEFAULT_DELIVERY_DATE: ${{ steps.dates.outputs.delivery_date }}
          DEFAULT_TARGET_DELIVERY_DATE: ${{ steps.dates.outputs.target_delivery_date }}
          DEFAULT_FAIL_ON_FETCH_ERROR: "true"
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], "r", encoding="utf-8") as handle:
              event = json.load(handle)

          inputs = event.get("inputs") or {}

          def event_input(name: str) -> str:
              value = inputs.get(name, "")
              if value is None:
                  return ""
              return str(value).strip()

          delivery_date = event_input("delivery_date") or os.environ["DEFAULT_DELIVERY_DATE"]
          target_delivery_date = event_input("target_delivery_date") or os.environ["DEFAULT_TARGET_DELIVERY_DATE"]
          fail_on_fetch_error_input = event_input("fail_on_fetch_error")
          fail_on_fetch_error = (
              fail_on_fetch_error_input or os.environ["DEFAULT_FAIL_ON_FETCH_ERROR"]
          ).lower() in {"1", "true", "yes"}

          print(f"delivery_date={delivery_date}")
          print(f"target_delivery_date={target_delivery_date}")
          print(f"fail_on_fetch_error={'true' if fail_on_fetch_error else 'false'}")
          PY

      - name: Materialize realized BESS index
        shell: bash
        run: |
          set -euo pipefail
          args=(--output-dir "$OUTPUT_DIR" --delivery-date "${{ steps.publish_inputs.outputs.delivery_date }}")
          if [ "${{ steps.publish_inputs.outputs.fail_on_fetch_error }}" = "true" ]; then
            args+=(--fail-on-fetch-error)
          fi
          uv run --no-project \
            --with cvxpy \
            --with httpx \
            --with beautifulsoup4 \
            python scripts/materialize_public_bess_arbitrage_index.py "${args[@]}"

      - name: Materialize forecast challenge
        shell: bash
        run: |
          set -euo pipefail
          args=(--output-dir "$OUTPUT_DIR" --history-days 10 --target-delivery-date "${{ steps.publish_inputs.outputs.target_delivery_date }}")
          if [ "${{ steps.publish_inputs.outputs.fail_on_fetch_error }}" = "true" ]; then
            args+=(--fail-on-fetch-error)
          fi
          uv run --no-project \
            --with httpx \
            --with beautifulsoup4 \
            python scripts/materialize_public_forecast_challenge.py "${args[@]}"

      - name: Commit public JSON changes
        id: commit_public_json
        shell: bash
        run: |
          set -euo pipefail
          git status --short "$OUTPUT_DIR"
          if [ -z "$(git status --porcelain "$OUTPUT_DIR")" ]; then
            echo "No public BESS JSON changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$OUTPUT_DIR"
          git commit -m "Update public BESS index data"
          git push origin "HEAD:${{ github.ref_name }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify GitHub raw public JSON freshness
        shell: bash
        run: |
          set -euo pipefail
          expected_delivery_date="${{ steps.publish_inputs.outputs.delivery_date }}"
          raw_url="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/$OUTPUT_DIR/latest.json?run=${{ github.run_id }}"
          for attempt in {1..12}; do
            actual_delivery_date="$(python - "$raw_url" <<'PY'
          import json
          import sys
          import urllib.request

          with urllib.request.urlopen(sys.argv[1], timeout=20) as response:
              payload = json.load(response)
          print(payload["source"]["delivery_date"])
          PY
            )"
            if [ "$actual_delivery_date" = "$expected_delivery_date" ]; then
              echo "GitHub raw latest.json is fresh for $actual_delivery_date."
              exit 0
            fi
            echo "GitHub raw latest.json returned $actual_delivery_date, expected $expected_delivery_date; retrying..."
            sleep 10
          done
          echo "::error title=GitHub raw latest.json stale::Expected $expected_delivery_date from $raw_url."
          exit 1

      - name: Best-effort trigger Vercel production deploy
        if: steps.commit_public_json.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: dashboard
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            if curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"; then
              echo "Triggered Vercel production deploy hook."
            else
              echo "::warning title=Vercel deploy hook failed::Public JSON is already committed and available through GitHub raw."
            fi
            exit 0
          fi

          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            mkdir -p .vercel
            printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
            if npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"; then
              echo "Triggered Vercel production deploy through CLI."
            else
              echo "::warning title=Vercel CLI deploy failed::Public JSON is already committed and available through GitHub raw."
            fi
            exit 0
          fi

          echo "::warning title=Vercel deploy not configured::Set VERCEL_DEPLOY_HOOK_URL or VERCEL_TOKEN + VERCEL_ORG_ID + VERCEL_PROJECT_ID to redeploy static code. Public JSON freshness no longer depends on this step."
