name: Publish public BESS weekly personal post

on:
  schedule:
    - cron: "10 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-bess-social-weekly
  cancel-in-progress: false

jobs:
  weekly-personal-x-post:
    runs-on: ubuntu-latest
    env:
      X_PERSONAL_HANDLE: fefelov
      X_PERSONAL_API_KEY: ${{ secrets.X_PERSONAL_API_KEY }}
      X_PERSONAL_API_SECRET: ${{ secrets.X_PERSONAL_API_SECRET }}
      X_PERSONAL_ACCESS_TOKEN: ${{ secrets.X_PERSONAL_ACCESS_TOKEN }}
      X_PERSONAL_ACCESS_TOKEN_SECRET: ${{ secrets.X_PERSONAL_ACCESS_TOKEN_SECRET }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Build and publish weekly personal X post
        run: |
          uv run --no-project \
            --with pillow \
            --with tweepy \
            python scripts/social_bess_index.py weekly \
              --x-account personal \
              --output-dir .social-outbox

      - name: Upload social outbox artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-bess-weekly-personal-social-outbox
          path: .social-outbox

      - name: Commit social log
        run: |
          set -euo pipefail
          if [ ! -f docs/marketing/social_log.json ]; then
            echo "No social log to commit."
            exit 0
          fi
          if [ -z "$(git status --porcelain docs/marketing/social_log.json)" ]; then
            echo "No social log changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/marketing/social_log.json
          git commit -m "Record public BESS weekly personal social post"
          git push origin HEAD:main
