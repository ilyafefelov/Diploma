# Ukrainian V13 context acquisition readiness.
#
# This config does not train a selector, build V13 candidates, or start DT/LAVA.
# It consumes the V12 safe-teacher result and emits an acquisition/readiness gate:
# - dfl_ua_context_acquisition_source_evidence_v13_frame
# - dfl_ua_context_source_inventory_v13_frame
# - dfl_ua_context_acquisition_readiness_v13_frame
#
# V2+ remains the frozen comparator and market execution stays off.
ops:
  observed_market_price_history_bronze:
    config:
      start_date: "2025-01-01"
      end_date: "2026-04-30"
  tenant_historical_weather_bronze:
    config:
      tenant_ids_csv: "client_001_kyiv_mall,client_002_lviv_office,client_003_dnipro_factory,client_004_kharkiv_hospital,client_005_odesa_hotel"
      start_date: "2025-01-01"
      end_date: "2026-04-30"
      location_config_path: "simulations/tenants.yml"
  ukrenergo_grid_events_bronze:
    config:
      max_posts: 0
      max_archive_pages: 250
      archive_start_date: "2025-01-01"
  dfl_ua_context_source_inventory_frame:
    config:
      source_window_start: "2025-01-01"
      source_window_end: "2026-04-30"
      oree_dam_publication_rule_enabled: true
      oree_dam_publication_hour_kyiv: 14
      oree_dam_publication_source_url: "https://www.oree.com.ua/index.php/web/13245784"
      oree_dam_publication_source_title: "OREE market rules: day-ahead trading results publication"
