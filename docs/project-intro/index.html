<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BESS Operator Preview - Project Intro</title>
    <meta
      name="description"
      content="Short English introduction video for the source-backed DAM/IDM hourly operator recommendation preview."
    >
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #071827;
        color: #e8f8ff;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 18px;
        background:
          radial-gradient(circle at 18% 18%, rgba(13, 190, 240, 0.22), transparent 30%),
          linear-gradient(135deg, #071827 0%, #0b3655 52%, #082138 100%);
      }

      main {
        width: min(1040px, 100%);
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(28px, 4vw, 46px);
        line-height: 1.05;
        letter-spacing: 0;
      }

      p {
        max-width: 760px;
        margin: 0 0 22px;
        color: #b9d9e8;
        font-size: 16px;
        line-height: 1.55;
      }

      .video-shell {
        border: 1px solid rgba(161, 238, 255, 0.32);
        border-radius: 8px;
        background: rgba(4, 21, 34, 0.74);
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.34);
        padding: 10px;
      }

      video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        border-radius: 6px;
        background: #041522;
      }

      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 18px;
      }

      a {
        color: #9ff733;
        text-decoration: none;
        font-weight: 700;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>BESS Operator Preview</h1>
      <p>
        A 42-second English introduction to the thesis product: source-backed
        DAM/IDM hourly recommendation preview, offline evidence, deterministic
        safety boundaries, and no market execution.
      </p>
      <section class="video-shell" aria-label="Project introduction video">
        <video
          controls
          preload="metadata"
          poster="../technical/final-demo-assets/project-intro-poster.png"
        >
          <source src="../technical/final-demo-assets/project-intro.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </section>
      <nav class="links" aria-label="Repository links">
        <a href="https://github.com/ilyafefelov/Diploma">Repository README</a>
        <a href="https://github.com/ilyafefelov/Diploma/blob/main/docs/technical/FINAL_DEFENSE_RUNBOOK.md">Defense runbook</a>
        <a href="https://github.com/ilyafefelov/Diploma/blob/main/docs/technical/FINAL_EVIDENCE_INDEX.md">Evidence index</a>
      </nav>
    </main>
  </body>
</html>
