<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Діагностика плато після V2+</title>
  <desc id="desc">Пояснення, чому V3, V4 і V5 не покращили V2+: candidate_not_better, fallback_too_conservative та контекстні прогалини.</desc>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#111827">Чому V3/V4/V5 не перевершили V2+</text>
  <text x="70" y="104" font-family="Arial, sans-serif" font-size="18" fill="#475569">Плато пояснюється не помилкою gate, а нестачею стабільно кращих schedule candidates та prior-only context.</text>

  <text x="70" y="155" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#111827">V4 final-holdout autopsy, 90 tenant-anchor rows per source</text>
  <g font-family="Arial, sans-serif" font-size="16" fill="#111827">
    <text x="70" y="220">Calibrated NBEATSx</text>
    <rect x="285" y="196" width="568" height="34" rx="5" fill="#ef4444"/>
    <rect x="853" y="196" width="152" height="34" rx="5" fill="#f97316"/>
    <text x="520" y="219" fill="#ffffff" font-weight="700">candidate_not_better: 71 / 90</text>
    <text x="875" y="219" fill="#ffffff" font-weight="700">19 / 90</text>

    <text x="70" y="290">Raw NBEATSx</text>
    <rect x="285" y="266" width="384" height="34" rx="5" fill="#ef4444"/>
    <rect x="669" y="266" width="336" height="34" rx="5" fill="#f97316"/>
    <text x="415" y="289" fill="#ffffff" font-weight="700">candidate_not_better: 48 / 90</text>
    <text x="755" y="289" fill="#ffffff" font-weight="700">fallback_too_conservative: 42 / 90</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" fill="#475569">
    <rect x="285" y="326" width="18" height="18" rx="3" fill="#ef4444"/>
    <text x="312" y="341">немає кандидата, що стабільно кращий за V2+</text>
    <rect x="650" y="326" width="18" height="18" rx="3" fill="#f97316"/>
    <text x="677" y="341">кандидат іноді кращий, але prior signal недостатній для thesis gate</text>
  </g>

  <text x="70" y="410" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#111827">V5 point-in-time context repair</text>
  <g font-family="Arial, sans-serif" font-size="17" fill="#111827">
    <rect x="70" y="438" width="330" height="128" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="92" y="474" font-size="25" font-weight="700" fill="#0f172a">14,600</text>
    <text x="92" y="504">context-audit rows</text>
    <text x="92" y="535" font-size="14" fill="#64748b">blockers are explicit per tenant/source/anchor</text>

    <rect x="435" y="438" width="330" height="128" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="457" y="474" font-size="25" font-weight="700" fill="#0f172a">3,650 x 3</text>
    <text x="457" y="504">missing context families</text>
    <text x="457" y="535" font-size="14" fill="#64748b">weather/load, calendar/event, publication-time</text>

    <rect x="800" y="438" width="330" height="128" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="822" y="474" font-size="25" font-weight="700" fill="#166534">174.77</text>
    <text x="822" y="504">V5 mean regret, UAH</text>
    <text x="822" y="535" font-size="14" fill="#64748b">matched V2+; no replacement claim</text>
  </g>

  <rect x="70" y="620" width="1060" height="84" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="92" y="655" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9a3412">Висновок для подальшої роботи</text>
  <text x="92" y="682" font-family="Arial, sans-serif" font-size="16" fill="#7c2d12">Більший DT над тим самим objective не є першим кроком. Потрібні нові point-in-time context families або teacher-trajectory DFL/DT, що б'ється проти V2+.</text>
</svg>
