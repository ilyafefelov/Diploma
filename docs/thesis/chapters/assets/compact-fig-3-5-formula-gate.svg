<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Як метрики переходять у рішення gate</title>
  <desc id="desc">Схема показує, як вирази value, regret, improvement, robustness і promotion gate разом формують offline/read-model decision.</desc>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#111827">Від математичних виразів до gate decision</text>
  <text x="70" y="104" font-family="Arial, sans-serif" font-size="18" fill="#475569">Кожен candidate проходить однаковий LP/oracle contour; promotion не дорівнює market execution.</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="150" width="230" height="118" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="92" y="184" font-size="18" font-weight="700" fill="#1e3a8a">Schedule value</text>
    <text x="92" y="214" font-size="24" font-weight="700" fill="#111827">(3.1)</text>
    <text x="92" y="244" font-size="15" fill="#475569">V(s) after feasible LP schedule</text>

    <rect x="345" y="150" width="230" height="118" rx="8" fill="#ecfdf5" stroke="#86efac"/>
    <text x="367" y="184" font-size="18" font-weight="700" fill="#166534">Regret</text>
    <text x="367" y="214" font-size="24" font-weight="700" fill="#111827">(3.2)</text>
    <text x="367" y="244" font-size="15" fill="#475569">Selected value vs oracle</text>

    <rect x="620" y="150" width="230" height="118" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="642" y="184" font-size="18" font-weight="700" fill="#334155">Improvement</text>
    <text x="642" y="214" font-size="24" font-weight="700" fill="#111827">(3.3)</text>
    <text x="642" y="244" font-size="15" fill="#475569">Mean gain vs strict</text>

    <rect x="895" y="150" width="235" height="118" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="917" y="184" font-size="18" font-weight="700" fill="#92400e">Robustness</text>
    <text x="917" y="214" font-size="24" font-weight="700" fill="#111827">(3.4)</text>
    <text x="917" y="244" font-size="15" fill="#475569">Window pass rate</text>

    <line x1="304" y1="209" x2="338" y2="209" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="579" y1="209" x2="613" y2="209" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="854" y1="209" x2="888" y2="209" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="160" y="350" width="250" height="118" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="182" y="384" font-size="18" font-weight="700" fill="#111827">Mean gate</text>
    <text x="182" y="414" font-size="24" font-weight="700" fill="#111827">(3.5)</text>
    <text x="182" y="444" font-size="15" fill="#475569">Candidate mean regret must improve</text>

    <rect x="475" y="350" width="250" height="118" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="497" y="384" font-size="18" font-weight="700" fill="#111827">Median gate</text>
    <text x="497" y="414" font-size="24" font-weight="700" fill="#111827">(3.6)</text>
    <text x="497" y="444" font-size="15" fill="#475569">Median behavior cannot degrade</text>

    <rect x="790" y="350" width="250" height="118" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="812" y="384" font-size="18" font-weight="700" fill="#991b1b">Safety boundary</text>
    <text x="812" y="414" font-size="24" font-weight="700" fill="#111827">no execution</text>
    <text x="812" y="444" font-size="15" fill="#475569">market_execution_enabled=false</text>

    <line x1="285" y1="272" x2="285" y2="343" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="735" y1="272" x2="600" y2="343" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="1012" y1="272" x2="915" y2="343" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="210" y="532" width="780" height="116" rx="10" fill="#ecfeff" stroke="#67e8f9"/>
    <text x="238" y="570" font-size="22" font-weight="700" fill="#164e63">Promotion gate (3.7)</text>
    <text x="238" y="603" font-size="17" fill="#334155">G1 and G2 and robustness and safety support offline/read-model promotion.</text>
    <text x="238" y="632" font-size="17" fill="#991b1b">Still no ProposedBid, DispatchCommand, or live market action.</text>

    <line x1="285" y1="472" x2="455" y2="525" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="600" y1="472" x2="600" y2="525" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="915" y1="472" x2="745" y2="525" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
