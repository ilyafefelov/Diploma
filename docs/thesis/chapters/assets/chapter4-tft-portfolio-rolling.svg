<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">TFT як комплементарне джерело schedule candidates</title>
  <desc id="desc">Показано, що TFT має локальні можливості, але NBEATSx+TFT portfolio rolling gate не проходить 4-window robustness.</desc>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#111827">TFT як complementary expert: корисно, але не robust headline</text>
  <text x="70" y="104" font-family="Arial, sans-serif" font-size="18" fill="#475569">TFT-derived p10/p50/p90 schedules перевіряються через той самий strict LP/oracle gate, не через raw forecast claim.</text>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="140" width="245" height="126" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="92" y="178" font-size="28" font-weight="700" fill="#6d28d9">24 / 90</text>
    <text x="92" y="209" font-size="16" fill="#312e81">latest tenant-anchors</text>
    <text x="92" y="236" font-size="14" fill="#64748b">TFT candidate beats V2+ locally</text>

    <rect x="345" y="140" width="245" height="126" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="367" y="178" font-size="28" font-weight="700" fill="#0f172a">120,380</text>
    <text x="367" y="209" font-size="16" fill="#334155">portfolio rows</text>
    <text x="367" y="236" font-size="14" fill="#64748b">bounded full-data candidate table</text>

    <rect x="620" y="140" width="245" height="126" rx="8" fill="#ecfdf5" stroke="#86efac"/>
    <text x="642" y="178" font-size="28" font-weight="700" fill="#166534">90 / 90</text>
    <text x="642" y="209" font-size="16" fill="#166534">latest fallback rows</text>
    <text x="642" y="236" font-size="14" fill="#64748b">selector stayed with V2+</text>

    <rect x="895" y="140" width="235" height="126" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="917" y="178" font-size="28" font-weight="700" fill="#b91c1c">0 / 4</text>
    <text x="917" y="209" font-size="16" fill="#7f1d1d">rolling windows passed</text>
    <text x="917" y="236" font-size="14" fill="#64748b">negative replacement evidence</text>
  </g>

  <text x="70" y="325" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#111827">Rolling strict LP/oracle replay: V2+ vs NBEATSx+TFT portfolio</text>
  <line x1="250" y1="370" x2="1080" y2="370" stroke="#e5e7eb" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#64748b">
    <text x="250" y="358">0</text>
    <text x="411" y="358">300</text>
    <text x="572" y="358">600</text>
    <text x="733" y="358">900</text>
    <text x="894" y="358">1200</text>
    <text x="1040" y="358">1500</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="16" fill="#111827">
    <text x="70" y="414">Window 0</text>
    <rect x="250" y="390" width="94" height="18" rx="4" fill="#16a34a"/>
    <rect x="250" y="414" width="94" height="18" rx="4" fill="#8b5cf6"/>
    <text x="360" y="428">174.77 = 174.77</text>

    <text x="70" y="488">Window 1</text>
    <rect x="250" y="464" width="121" height="18" rx="4" fill="#16a34a"/>
    <rect x="250" y="488" width="121" height="18" rx="4" fill="#8b5cf6"/>
    <text x="388" y="502">226.12 = 226.12</text>

    <text x="70" y="562">Window 2</text>
    <rect x="250" y="538" width="211" height="18" rx="4" fill="#16a34a"/>
    <rect x="250" y="562" width="755" height="18" rx="4" fill="#8b5cf6"/>
    <text x="475" y="552">V2+: 393.82</text>
    <text x="1020" y="576">Portfolio: 1407.48</text>

    <text x="70" y="636">Window 3</text>
    <rect x="250" y="612" width="526" height="18" rx="4" fill="#16a34a"/>
    <rect x="250" y="636" width="542" height="18" rx="4" fill="#8b5cf6"/>
    <text x="790" y="626">981.62</text>
    <text x="806" y="650">1011.35</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="15" fill="#475569">
    <rect x="70" y="690" width="18" height="18" rx="3" fill="#16a34a"/>
    <text x="98" y="705">Frozen Ukrainian-only V2+</text>
    <rect x="330" y="690" width="18" height="18" rx="3" fill="#8b5cf6"/>
    <text x="358" y="705">NBEATSx+TFT portfolio selector</text>
    <text x="640" y="705" fill="#991b1b">Висновок: TFT має local opportunity, але current prior-only selector не експлуатує її robustly.</text>
  </g>
</svg>
