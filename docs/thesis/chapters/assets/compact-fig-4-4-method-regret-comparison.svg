<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Порівняння mean regret для raw, DT, strict, V2 і V2+</title>
  <desc id="desc">Горизонтальна діаграма mean regret у гривнях для основних підходів: raw reference, Decision Transformer shadow, strict reference, V2 and V2+.</desc>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#111827">Decision-value comparison: lower regret is better</text>
  <text x="70" y="104" font-family="Arial, sans-serif" font-size="18" fill="#475569">Порівняння використовує однаковий strict LP/oracle contour; execution залишається disabled.</text>

  <g font-family="Arial, sans-serif">
    <line x1="350" y1="150" x2="1050" y2="150" stroke="#e5e7eb" stroke-width="2"/>
    <g font-size="13" fill="#64748b">
      <text x="350" y="138">0</text>
      <text x="462" y="138">100</text>
      <text x="574" y="138">200</text>
      <text x="686" y="138">300</text>
      <text x="798" y="138">400</text>
      <text x="910" y="138">500</text>
      <text x="1022" y="138">600</text>
    </g>
    <g stroke="#eef2f7" stroke-width="1">
      <line x1="350" y1="150" x2="350" y2="575"/>
      <line x1="462" y1="150" x2="462" y2="575"/>
      <line x1="574" y1="150" x2="574" y2="575"/>
      <line x1="686" y1="150" x2="686" y2="575"/>
      <line x1="798" y1="150" x2="798" y2="575"/>
      <line x1="910" y1="150" x2="910" y2="575"/>
      <line x1="1022" y1="150" x2="1022" y2="575"/>
    </g>

    <text x="70" y="206" font-size="18" font-weight="700" fill="#111827">raw_reference</text>
    <rect x="350" y="180" width="697" height="34" rx="5" fill="#dc2626"/>
    <text x="1060" y="204" font-size="18" font-weight="700" fill="#991b1b">622.25</text>
    <text x="70" y="232" font-size="14" fill="#64748b">forecast vector without schedule-value selection</text>

    <text x="70" y="286" font-size="18" font-weight="700" fill="#111827">DT shadow</text>
    <rect x="350" y="260" width="516" height="34" rx="5" fill="#f97316"/>
    <text x="880" y="284" font-size="18" font-weight="700" fill="#9a3412">460.30</text>
    <text x="70" y="312" font-size="14" fill="#64748b">candidate-index classifier, not promoted</text>

    <text x="70" y="366" font-size="18" font-weight="700" fill="#111827">strict_reference</text>
    <rect x="350" y="340" width="348" height="34" rx="5" fill="#f59e0b"/>
    <text x="712" y="364" font-size="18" font-weight="700" fill="#92400e">310.58</text>
    <text x="70" y="392" font-size="14" fill="#64748b">safe leakage-free fallback</text>

    <text x="70" y="446" font-size="18" font-weight="700" fill="#111827">Schedule/Value V2</text>
    <rect x="350" y="420" width="231" height="34" rx="5" fill="#60a5fa"/>
    <text x="596" y="444" font-size="18" font-weight="700" fill="#1d4ed8">206.37</text>
    <text x="70" y="472" font-size="14" fill="#64748b">first robust schedule/value learner</text>

    <text x="70" y="526" font-size="18" font-weight="700" fill="#111827">Schedule/Value V2+</text>
    <rect x="350" y="500" width="196" height="34" rx="5" fill="#16a34a"/>
    <text x="560" y="524" font-size="18" font-weight="700" fill="#166534">174.77</text>
    <text x="70" y="552" font-size="14" fill="#64748b">candidate library + prior-only selector + V2 fallback</text>

    <rect x="70" y="615" width="1060" height="58" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="95" y="650" font-size="17" fill="#334155">Interpretation: V2+ is strongest in this evidence set because it optimizes downstream decision quality, not forecast error or classifier accuracy.</text>
  </g>
</svg>
