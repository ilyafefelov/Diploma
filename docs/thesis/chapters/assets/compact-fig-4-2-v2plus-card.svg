<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">V2+ headline result card and non-execution boundary</title>
  <desc id="desc">Summary card for V2+ headline result with shadow challenger context and no-execution boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfeff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <style>
      .title { font: 800 54px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 24px Arial, sans-serif; fill: #475569; }
      .card-title { font: 800 28px Arial, sans-serif; fill: #0f172a; }
      .big { font: 900 62px Arial, sans-serif; fill: #064e3b; }
      .label { font: 700 20px Arial, sans-serif; fill: #334155; }
      .small { font: 500 18px Arial, sans-serif; fill: #475569; }
      .white { font: 800 19px Arial, sans-serif; fill: #fff; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="72" y="90" class="title" style="font-size:42px">V2+ headline card and shadow boundary</text>
  <text x="72" y="130" class="subtitle">V2+ є confirmed offline/read-model comparator; DT/HF не змінюють default без окремого gate.</text>

  <g transform="translate(80 190)">
    <rect width="430" height="480" rx="26" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="34" y="58" class="card-title">V2+ headline evidence</text>
    <text x="34" y="145" class="big">174.77</text>
    <text x="42" y="178" class="label">UAH mean regret</text>
    <line x1="34" y1="220" x2="396" y2="220" stroke="#86efac" stroke-width="3"/>
    <text x="34" y="272" class="card-title">43.73%</text>
    <text x="158" y="272" class="label">improvement vs strict</text>
    <text x="34" y="340" class="card-title">4 / 4</text>
    <text x="134" y="340" class="label">rolling robustness</text>
    <text x="34" y="408" class="card-title">15.31%</text>
    <text x="158" y="408" class="label">improvement vs V2</text>
  </g>

  <g transform="translate(585 190)">
    <rect width="420" height="480" rx="26" fill="#eff6ff" stroke="#0284c7" stroke-width="3"/>
    <text x="34" y="58" class="card-title">DT safe-switch</text>
    <text x="34" y="125" class="big" fill="#0f766e">168.16</text>
    <text x="42" y="158" class="label">UAH secondary mean regret</text>
    <text x="34" y="225" class="card-title">4 / 90 switches</text>
    <text x="34" y="268" class="small">86 / 90 abstentions, 0 tail-risk losses</text>
    <rect x="34" y="320" width="352" height="54" rx="27" fill="#0284c7"/>
    <text x="73" y="354" class="white">positive but not promoted</text>
    <text x="34" y="418" class="small">Stopped by threshold, gate policy,</text>
    <text x="34" y="444" class="small">and secondary evidence status.</text>
  </g>

  <g transform="translate(1090 190)">
    <rect width="420" height="480" rx="26" fill="#f5f3ff" stroke="#7c3aed" stroke-width="3"/>
    <text x="34" y="58" class="card-title">HF value-aligned shadow</text>
    <text x="34" y="125" class="big" fill="#6d28d9">158.71</text>
    <text x="42" y="158" class="label">UAH frozen diagnostic signal</text>
    <text x="34" y="225" class="card-title">20 / 32 nonfallback</text>
    <text x="34" y="268" class="small">62.5% switch rate, 0 safety failures</text>
    <rect x="34" y="320" width="352" height="54" rx="27" fill="#7c3aed"/>
    <text x="75" y="354" class="white">manual shadow only</text>
    <text x="34" y="418" class="small">Stopped before production: it ranks</text>
    <text x="34" y="444" class="small">finite candidates, not full LP space.</text>
  </g>

  <g transform="translate(90 735)">
    <rect width="1420" height="72" rx="18" fill="#0f172a"/>
    <text x="34" y="45" class="white">No production controller: no ProposedBid, no market payload, no live dispatch, no production LP replacement.</text>
  </g>
</svg>
