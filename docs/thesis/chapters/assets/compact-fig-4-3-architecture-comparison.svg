<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Архітектурне порівняння raw, strict, V2+, DFL і DT</title>
  <desc id="desc">Порівняння підходів за рівнем, на якому вони приймають рішення: прогноз, fallback, schedule/value selector або research-shadow model.</desc>
  <rect width="1200" height="760" fill="#ffffff"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#111827">Чому V2+ сильніший: рішення на рівні schedule/value</text>
  <text x="70" y="104" font-family="Arial, sans-serif" font-size="18" fill="#475569">Перевага виникає не з назви моделі, а з того, де саме стоїть decision layer.</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="150" width="196" height="420" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="95" y="188" font-size="20" font-weight="700" fill="#334155">Raw forecast</text>
    <text x="95" y="226" font-size="16" fill="#111827">forecast scenario</text>
    <text x="95" y="258" font-size="15" fill="#475569">price vector only</text>
    <line x1="105" y1="292" x2="230" y2="292" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="95" y="336" font-size="15" fill="#475569">LP receives scenario,</text>
    <text x="95" y="360" font-size="15" fill="#475569">but no schedule-level</text>
    <text x="95" y="384" font-size="15" fill="#475569">fallback learning.</text>
    <rect x="95" y="455" width="145" height="55" rx="6" fill="#fee2e2" stroke="#fecaca"/>
    <text x="118" y="488" font-size="16" font-weight="700" fill="#991b1b">High regret</text>

    <rect x="292" y="150" width="196" height="420" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="317" y="188" font-size="20" font-weight="700" fill="#92400e">Strict</text>
    <text x="317" y="226" font-size="16" fill="#111827">similar-day LP</text>
    <text x="317" y="258" font-size="15" fill="#475569">safe deterministic</text>
    <text x="317" y="282" font-size="15" fill="#475569">control/fallback</text>
    <line x1="327" y1="320" x2="452" y2="320" stroke="#d97706" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="317" y="360" font-size="15" fill="#475569">No learned</text>
    <text x="317" y="384" font-size="15" fill="#475569">candidate switching.</text>
    <rect x="317" y="455" width="145" height="55" rx="6" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="338" y="488" font-size="16" font-weight="700" fill="#92400e">Good baseline</text>

    <rect x="514" y="150" width="196" height="420" rx="8" fill="#ecfdf5" stroke="#86efac"/>
    <text x="539" y="188" font-size="20" font-weight="700" fill="#166534">V2+</text>
    <text x="539" y="226" font-size="16" fill="#111827">official row or</text>
    <text x="539" y="258" font-size="15" fill="#475569">forecast scenario +</text>
    <text x="539" y="282" font-size="15" fill="#475569">candidate library</text>
    <line x1="549" y1="320" x2="674" y2="320" stroke="#16a34a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="539" y="360" font-size="15" fill="#475569">Prior-only selector</text>
    <text x="539" y="384" font-size="15" fill="#475569">with V2 fallback.</text>
    <rect x="539" y="455" width="145" height="55" rx="6" fill="#dcfce7" stroke="#86efac"/>
    <text x="570" y="488" font-size="16" font-weight="700" fill="#166534">Best current</text>

    <rect x="736" y="150" width="196" height="420" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="761" y="188" font-size="20" font-weight="700" fill="#1d4ed8">DFL shadow</text>
    <text x="761" y="226" font-size="16" fill="#111827">regret-aware target</text>
    <text x="761" y="258" font-size="15" fill="#475569">candidate value</text>
    <text x="761" y="282" font-size="15" fill="#475569">or delta vs V2+</text>
    <line x1="771" y1="320" x2="896" y2="320" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="761" y="360" font-size="15" fill="#475569">Current features</text>
    <text x="761" y="384" font-size="15" fill="#475569">do not justify switch.</text>
    <rect x="761" y="455" width="145" height="55" rx="6" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="783" y="488" font-size="16" font-weight="700" fill="#1d4ed8">Abstains</text>

    <rect x="958" y="150" width="172" height="420" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="983" y="188" font-size="20" font-weight="700" fill="#991b1b">DT shadow</text>
    <text x="983" y="226" font-size="16" fill="#111827">sequence model</text>
    <text x="983" y="258" font-size="15" fill="#475569">candidate-index</text>
    <text x="983" y="282" font-size="15" fill="#475569">classifier</text>
    <line x1="993" y1="320" x2="1088" y2="320" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="983" y="360" font-size="15" fill="#475569">Cross-entropy</text>
    <text x="983" y="384" font-size="15" fill="#475569">is not regret loss.</text>
    <rect x="983" y="455" width="122" height="55" rx="6" fill="#fee2e2" stroke="#fecaca"/>
    <text x="1008" y="488" font-size="16" font-weight="700" fill="#991b1b">Blocked</text>

    <rect x="70" y="620" width="1060" height="80" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="100" y="655" font-size="19" font-weight="700" fill="#134e4a">Analytical conclusion</text>
    <text x="100" y="684" font-size="16" fill="#334155">V2+ wins because it combines feasible schedule families, prior-only selection, V2 fallback, and unchanged strict LP/oracle scoring.</text>
  </g>
</svg>
