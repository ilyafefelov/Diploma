<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Operator preview allowed read-model and blocked execution objects</title>
  <desc id="desc">Diagram showing what the operator preview may display and what remains blocked.</desc>
  <defs>
    <style>
      .title { font: 800 50px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 23px Arial, sans-serif; fill: #475569; }
      .head { font: 800 28px Arial, sans-serif; fill: #0f172a; }
      .body { font: 600 21px Arial, sans-serif; fill: #334155; }
      .white { font: 800 20px Arial, sans-serif; fill: #fff; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f8fafc"/>
  <text x="72" y="88" class="title" style="font-size:42px">Operator preview: show evidence, block execution</text>
  <text x="72" y="128" class="subtitle">Dashboard може показати evidence-backed schedule preview, але не формує ринкову заявку або dispatch command.</text>

  <g transform="translate(100 205)">
    <rect width="610" height="470" rx="28" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
    <text x="38" y="62" class="head">Allowed read-model surface</text>
    <text x="48" y="130" class="body">✓ DAM/IDM 24 hourly recommendation rows</text>
    <text x="48" y="185" class="body">✓ Official OREE or forecast-store source mode</text>
    <text x="48" y="240" class="body">✓ V2+ comparator and fallback status</text>
    <text x="48" y="295" class="body">✓ DT/HF shadow diagnostics and abstention reason</text>
    <text x="48" y="350" class="body">✓ Nullable live regret before delivery</text>
    <rect x="48" y="390" width="485" height="54" rx="27" fill="#16a34a"/>
    <text x="82" y="424" class="white">operator decision support, not execution</text>
  </g>

  <g transform="translate(840 205)">
    <rect width="610" height="470" rx="28" fill="#fee2e2" stroke="#ef4444" stroke-width="4"/>
    <text x="38" y="62" class="head">Blocked execution surface</text>
    <text x="48" y="130" class="body">✕ ProposedBid</text>
    <text x="48" y="185" class="body">✕ Market order payload</text>
    <text x="48" y="240" class="body">✕ Live IDM bid / settlement action</text>
    <text x="48" y="295" class="body">✕ DispatchCommand to BESS</text>
    <text x="48" y="350" class="body">✕ Production LP replacement by HF</text>
    <rect x="48" y="390" width="485" height="54" rx="27" fill="#ef4444"/>
    <text x="105" y="424" class="white">requires separate execution context</text>
  </g>

  <g transform="translate(120 735)">
    <rect width="1360" height="70" rx="20" fill="#0f172a"/>
    <text x="34" y="44" class="white">Design rule: every non-HOLD preview must remain reversible, reviewable, source-backed, and non-submittable.</text>
  </g>
</svg>
