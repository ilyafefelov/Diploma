<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Експериментальний шлях від baseline до operator preview</title>
  <desc id="desc">Послідовність evidence gates: strict baseline, forecast adapters, LP scoring, V2/V2+ selection, shadow challengers і operator preview.</desc>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="70" y="70" font-family="Arial, sans-serif" font-size="31" font-weight="700" fill="#111827">Експериментальний шлях: від baseline до preview</text>
  <text x="70" y="104" font-family="Arial, sans-serif" font-size="18" fill="#475569">Немає нового live trading claim: кожний крок додає тільки offline/read-model evidence.</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif">
    <line x1="125" y1="290" x2="1075" y2="290" stroke="#99f6e4" stroke-width="8" stroke-linecap="round"/>
    <g>
      <circle cx="140" cy="290" r="34" fill="#fef3c7" stroke="#f59e0b" stroke-width="3"/>
      <text x="124" y="298" font-size="24" font-weight="700" fill="#92400e">1</text>
      <text x="140" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">strict_similar_day</text>
      <text x="140" y="392" text-anchor="middle" font-size="14" fill="#475569">leakage-free baseline</text>
    </g>

    <line x1="176" y1="290" x2="260" y2="290" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <circle cx="300" cy="290" r="34" fill="#eff6ff" stroke="#60a5fa" stroke-width="3"/>
      <text x="284" y="298" font-size="24" font-weight="700" fill="#1d4ed8">2</text>
      <text x="300" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">forecast adapters</text>
      <text x="300" y="392" text-anchor="middle" font-size="14" fill="#475569">NBEATSx / TFT</text>
    </g>

    <line x1="336" y1="290" x2="420" y2="290" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <circle cx="460" cy="290" r="34" fill="#ecfdf5" stroke="#22c55e" stroke-width="3"/>
      <text x="444" y="298" font-size="24" font-weight="700" fill="#166534">3</text>
      <text x="460" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">LP scoring</text>
      <text x="460" y="392" text-anchor="middle" font-size="14" fill="#475569">schedule + oracle</text>
    </g>

    <line x1="496" y1="290" x2="580" y2="290" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <circle cx="620" cy="290" r="34" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
      <text x="604" y="298" font-size="24" font-weight="700" fill="#166534">4</text>
      <text x="620" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">V2 / V2+</text>
      <text x="620" y="392" text-anchor="middle" font-size="14" fill="#475569">90 anchors; 4 windows</text>
    </g>

    <line x1="656" y1="290" x2="740" y2="290" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <circle cx="780" cy="290" r="34" fill="#fff7ed" stroke="#fb923c" stroke-width="3"/>
      <text x="764" y="298" font-size="24" font-weight="700" fill="#c2410c">5</text>
      <text x="780" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">shadow lanes</text>
      <text x="780" y="392" text-anchor="middle" font-size="14" fill="#475569">TFT / Poland / DT</text>
    </g>

    <line x1="816" y1="290" x2="900" y2="290" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <g>
      <circle cx="940" cy="290" r="34" fill="#ecfeff" stroke="#06b6d4" stroke-width="3"/>
      <text x="924" y="298" font-size="24" font-weight="700" fill="#0e7490">6</text>
      <text x="940" y="365" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">operator preview</text>
      <text x="940" y="392" text-anchor="middle" font-size="14" fill="#475569">read-model, no bid</text>
    </g>

    <rect x="70" y="475" width="330" height="96" rx="8" fill="#f8fafc" stroke="#dbe3ee"/>
    <text x="92" y="512" font-size="18" font-weight="700" fill="#111827">Positive signal</text>
    <text x="92" y="540" font-size="16" fill="#475569">V2+ lowers mean and median regret;</text>
    <text x="92" y="565" font-size="16" fill="#475569">it also passes 4/4 rolling windows.</text>

    <rect x="435" y="475" width="330" height="96" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="457" y="512" font-size="18" font-weight="700" fill="#92400e">Near miss</text>
    <text x="457" y="540" font-size="16" fill="#475569">Poland veto shows 4.41% improvement;</text>
    <text x="457" y="565" font-size="16" fill="#475569">this stays below the 5% threshold.</text>

    <rect x="800" y="475" width="330" height="96" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="822" y="512" font-size="18" font-weight="700" fill="#991b1b">Blocked claim</text>
    <text x="822" y="540" font-size="16" fill="#475569">DT/LAVA and execution stay blocked;</text>
    <text x="822" y="565" font-size="16" fill="#475569">source receipts remain missing.</text>

    <rect x="70" y="615" width="1060" height="55" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
    <text x="92" y="649" font-size="17" fill="#134e4a">Academic point: the result is a controlled decision-quality story, not a list of model names.</text>
  </g>
</svg>
