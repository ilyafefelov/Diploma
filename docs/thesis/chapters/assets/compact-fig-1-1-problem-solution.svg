<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="833" viewBox="0 0 1500 833" role="img" aria-labelledby="title desc">
  <title id="title">Problem-to-solution map</title>
  <desc id="desc">Схема показує перехід від DAM/IDM price signal до operator preview без market submission.</desc>
  <rect width="1500" height="833" fill="#f8fafc"/>
  <rect width="1500" height="80" fill="#2563be"/>
  <text x="43" y="55" font-family="Arial, sans-serif" font-size="36" font-weight="700" fill="#ffffff">Problem-to-solution map</text>

  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563be"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif" fill="#1f2937">
    <rect x="70" y="151" width="300" height="199" rx="18" fill="#ffffff" stroke="#2563be" stroke-width="2"/>
    <text x="94" y="194" font-size="24" font-weight="700">Проблема</text>
    <text x="94" y="230" font-size="20">Український DAM/IDM price</text>
    <text x="94" y="255" font-size="20">signal; BESS schedule має</text>
    <text x="94" y="280" font-size="20">цінність тільки після SOC,</text>
    <text x="94" y="305" font-size="20">efficiency та risk constraints.</text>

    <line x1="370" y1="250" x2="422" y2="250" stroke="#2563be" stroke-width="4" marker-end="url(#arrow-blue)"/>

    <rect x="431" y="151" width="300" height="199" rx="18" fill="#ffffff" stroke="#0f8b8d" stroke-width="2"/>
    <text x="454" y="194" font-size="24" font-weight="700">Метод</text>
    <text x="454" y="230" font-size="20">Official row first або</text>
    <text x="454" y="255" font-size="20">NBEATSx/TFT scenario;</text>
    <text x="454" y="280" font-size="20">deterministic LP + regret/value</text>
    <text x="454" y="305" font-size="20">evaluation без leakage.</text>

    <line x1="731" y1="250" x2="783" y2="250" stroke="#2563be" stroke-width="4" marker-end="url(#arrow-blue)"/>

    <rect x="790" y="151" width="300" height="199" rx="18" fill="#ffffff" stroke="#2563be" stroke-width="2"/>
    <text x="814" y="194" font-size="24" font-weight="700">Результат</text>
    <text x="814" y="230" font-size="20">V2+ знижує mean regret</text>
    <text x="814" y="255" font-size="20">до 174.77 UAH на latest</text>
    <text x="814" y="280" font-size="20">holdout; DT/V2+ shadow</text>
    <text x="814" y="305" font-size="20">лише diagnostic.</text>

    <line x1="1090" y1="250" x2="1142" y2="250" stroke="#2563be" stroke-width="4" marker-end="url(#arrow-blue)"/>

    <rect x="1151" y="151" width="279" height="199" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="1174" y="194" font-size="24" font-weight="700">Користь</text>
    <text x="1174" y="230" font-size="20">DAM/IDM hourly preview</text>
    <text x="1174" y="255" font-size="20">для оператора без</text>
    <text x="1174" y="280" font-size="20">ProposedBid або market</text>
    <text x="1174" y="305" font-size="20">submission.</text>

    <rect x="221" y="502" width="390" height="178" rx="18" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="244" y="550" font-size="24" font-weight="700">Safety boundary</text>
    <text x="244" y="582" font-size="20">market_execution_enabled=false;</text>
    <text x="244" y="607" font-size="20">no ProposedBid, ClearedTrade,</text>
    <text x="244" y="632" font-size="20">DispatchCommand, settlement</text>
    <text x="244" y="657" font-size="20">або live IDM bid.</text>

    <line x1="611" y1="591" x2="864" y2="591" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrow-amber)"/>

    <rect x="872" y="502" width="390" height="178" rx="18" fill="#eff6ff" stroke="#2563be" stroke-width="2"/>
    <text x="895" y="550" font-size="24" font-weight="700">Academic boundary</text>
    <text x="895" y="582" font-size="20">DAM/V2+ is headline evidence;</text>
    <text x="895" y="607" font-size="20">IDM is hourly preview lane;</text>
    <text x="895" y="632" font-size="20">no new execution claim.</text>
  </g>

  <text x="42" y="820" font-family="Arial, sans-serif" font-size="16" fill="#64748b">Smart Energy Arbitrage thesis visuals | DAM/IDM hourly recommendation preview | no market execution</text>
</svg>
