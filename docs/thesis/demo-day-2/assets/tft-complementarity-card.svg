<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">TFT complementarity evidence card</title>
  <desc id="desc">TFT local opportunities versus rolling robustness result.</desc>
  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="70" y="82" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#0f172a">Can TFT Help As Complementary Schedules?</text>
  <text x="70" y="118" font-family="Arial, sans-serif" font-size="18" fill="#475569">Answer after rolling strict gate: useful local diversity, not robust enough to replace V2+.</text>

  <g transform="translate(70 170)">
    <rect width="330" height="170" rx="14" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="28" y="48" font-family="Arial, sans-serif" font-size="18" fill="#5b21b6">Latest holdout opportunities</text>
    <text x="28" y="108" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#5b21b6">24 / 90</text>
    <text x="28" y="143" font-family="Arial, sans-serif" font-size="19" fill="#5b21b6">TFT candidate beats V2+</text>
  </g>

  <g transform="translate(435 170)">
    <rect width="330" height="170" rx="14" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="28" y="48" font-family="Arial, sans-serif" font-size="18" fill="#075985">Latest selector result</text>
    <text x="28" y="108" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#075985">90 / 90</text>
    <text x="28" y="143" font-family="Arial, sans-serif" font-size="19" fill="#075985">V2+ fallback selected</text>
  </g>

  <g transform="translate(800 170)">
    <rect width="330" height="170" rx="14" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="28" y="48" font-family="Arial, sans-serif" font-size="18" fill="#991b1b">Rolling strict gate</text>
    <text x="28" y="108" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#991b1b">0 / 4</text>
    <text x="28" y="143" font-family="Arial, sans-serif" font-size="19" fill="#991b1b">windows pass vs V2+</text>
  </g>

  <g transform="translate(70 405)">
    <rect width="1060" height="145" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="30" y="45" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Interpretation</text>
    <text x="30" y="84" font-family="Arial, sans-serif" font-size="18" fill="#334155">TFT does create some schedule diversity, but the prior-only selector cannot exploit it safely.</text>
    <text x="30" y="118" font-family="Arial, sans-serif" font-size="18" fill="#334155">Window 2 and 3 selections degraded mean and median regret, so V2+ remains the headline comparator.</text>
  </g>
</svg>
