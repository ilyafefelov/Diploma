<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Online read-model architecture</title>
  <desc id="desc">Read-only demo architecture from persisted evidence to Nuxt operator and defense pages.</desc>
  <rect width="1200" height="675" fill="#ffffff"/>
  <text x="70" y="78" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#111827">Online / Read-Model Demo Architecture</text>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif" font-size="18" fill="#111827">
    <rect x="90" y="205" width="230" height="120" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="120" y="250">Postgres</text><text x="120" y="280">evidence rows</text>
    <rect x="430" y="205" width="230" height="120" rx="12" fill="#dcfce7" stroke="#86efac"/>
    <text x="460" y="250">FastAPI</text><text x="460" y="280">dashboard endpoints</text>
    <rect x="770" y="130" width="250" height="120" rx="12" fill="#ede9fe" stroke="#c4b5fd"/>
    <text x="800" y="175">Nuxt /defense</text><text x="800" y="205">thesis evidence cards</text>
    <rect x="770" y="330" width="250" height="120" rx="12" fill="#fef3c7" stroke="#fbbf24"/>
    <text x="800" y="375">Nuxt /operator</text><text x="800" y="405">preview recommendations</text>
    <rect x="250" y="470" width="700" height="90" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="290" y="508">Boundary: preview-only recommendations, no live execution, no automatic market dispatch</text>
  </g>
  <g stroke="#475569" stroke-width="3" marker-end="url(#arrow)">
    <line x1="320" y1="265" x2="430" y2="265"/>
    <line x1="660" y1="250" x2="770" y2="190"/>
    <line x1="660" y1="280" x2="770" y2="390"/>
  </g>
</svg>
