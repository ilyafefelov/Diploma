<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Decision Transformer research-shadow sequence contract</title>
  <desc id="desc">Diagram of forecast, battery, tenant, candidate, and gate context flowing to a Decision Transformer research-shadow dataset.</desc>
  <rect width="1200" height="720" fill="#ffffff"/>
  <text x="70" y="74" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#111827">DT Research-Shadow Sequence Contract</text>
  <text x="70" y="108" font-family="Arial, sans-serif" font-size="18" fill="#4b5563">Offline sequence modeling over candidate schedules, not raw hourly BUY/SELL/HOLD market commands.</text>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#475569"/>
    </marker>
  </defs>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="158" width="250" height="78" rx="8" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="95" y="188" font-size="20" font-weight="700" fill="#1e3a8a">Forecast context</text>
    <text x="95" y="214" font-size="15" fill="#1d4ed8">NBEATSx + TFT coverage</text>

    <rect x="70" y="262" width="250" height="78" rx="8" fill="#f0fdf4" stroke="#4ade80"/>
    <text x="95" y="292" font-size="20" font-weight="700" fill="#14532d">Battery context</text>
    <text x="95" y="318" font-size="15" fill="#166534">SOC, slack, throughput, degradation</text>

    <rect x="70" y="366" width="250" height="78" rx="8" fill="#fefce8" stroke="#facc15"/>
    <text x="95" y="396" font-size="20" font-weight="700" fill="#713f12">Tenant context</text>
    <text x="95" y="422" font-size="15" fill="#854d0e">Tenant and source identity hashes</text>

    <rect x="70" y="470" width="250" height="78" rx="8" fill="#fff7ed" stroke="#fb923c"/>
    <text x="95" y="500" font-size="20" font-weight="700" fill="#7c2d12">Candidate context</text>
    <text x="95" y="526" font-size="15" fill="#9a3412">Value, regret, RTG, candidate count</text>

    <rect x="70" y="574" width="250" height="78" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
    <text x="95" y="604" font-size="20" font-weight="700" fill="#0f172a">Gate context</text>
    <text x="95" y="630" font-size="15" fill="#475569">V13 flag and receipt flag are false</text>

    <line x1="330" y1="197" x2="465" y2="340" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="330" y1="301" x2="465" y2="346" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="330" y1="405" x2="465" y2="360" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="330" y1="509" x2="465" y2="374" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="330" y1="613" x2="465" y2="388" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="465" y="252" width="300" height="200" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="500" y="292" font-size="23" font-weight="700" fill="#111827">Sequence tensors</text>
    <text x="500" y="326" font-size="17" fill="#334155">states: 7300 x 3 x 20</text>
    <text x="500" y="356" font-size="17" fill="#334155">actions: candidate index / family</text>
    <text x="500" y="386" font-size="17" fill="#334155">RTG: value or negative regret</text>
    <text x="500" y="416" font-size="17" fill="#334155">mask: feasible candidate actions</text>

    <line x1="775" y1="352" x2="880" y2="352" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="880" y="230" width="250" height="244" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="910" y="270" font-size="22" font-weight="700" fill="#4c1d95">HF DT smoke</text>
    <text x="910" y="304" font-size="17" fill="#5b21b6">DecisionTransformerModel</text>
    <text x="910" y="334" font-size="17" fill="#5b21b6">6940 train sequences</text>
    <text x="910" y="364" font-size="17" fill="#5b21b6">360 eval sequences</text>
    <text x="910" y="394" font-size="17" fill="#5b21b6">promotion=false</text>
    <text x="910" y="424" font-size="17" fill="#5b21b6">market_execution=false</text>
  </g>
</svg>
